name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dinein_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan tracked files for committed secrets
        run: bash scripts/scan_repo_secrets.sh

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dinein_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  integration-test:
    runs-on: ubuntu-latest
    needs: flutter
    defaults:
      run:
        working-directory: dinein_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Chrome + ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true
          install-chromedriver: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Start ChromeDriver
        run: |
          "${{ steps.setup-chrome.outputs.chromedriver-path }}" --port=4444 >/tmp/chromedriver.log 2>&1 &
          until curl -fsS http://127.0.0.1:4444/status >/dev/null; do sleep 1; done

      - name: Run integration smoke tests
        run: |
          flutter drive \
            -d web-server \
            --browser-name=chrome \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_smoke_flow_test.dart \
            --headless

  android-release-artifacts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [mt, rw]
    defaults:
      run:
        working-directory: dinein_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android release artifacts
        env:
          CI_KEYSTORE_PATH: ${{ runner.temp }}/dinein-ci.keystore
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: dinein
          ANDROID_KEY_PASSWORD: android
          SUPABASE_URL_MT: https://mock-ci-mt.supabase.co
          SUPABASE_ANON_KEY_MT: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mt.mock.signature
          SUPABASE_URL_RW: https://mock-ci-rw.supabase.co
          SUPABASE_ANON_KEY_RW: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.rw.mock.signature
        run: |
          keytool -genkeypair \
            -v \
            -keystore "${CI_KEYSTORE_PATH}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}" \
            -keypass "${ANDROID_KEY_PASSWORD}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=DineIn CI, OU=CI, O=DineIn, L=Test, S=Test, C=US"
          export ANDROID_KEYSTORE_FILE="${CI_KEYSTORE_PATH}"
          ./scripts/build_android_release.sh --flavor "${{ matrix.flavor }}" --skip-checks

  ios-build-validate:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [mt, rw]
    defaults:
      run:
        working-directory: dinein_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Validate iOS release build
        env:
          COCOAPODS_DISABLE_STATS: true
          SUPABASE_URL_MT: https://mock-ci-mt.supabase.co
          SUPABASE_ANON_KEY_MT: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mt.mock.signature
          SUPABASE_URL_RW: https://mock-ci-rw.supabase.co
          SUPABASE_ANON_KEY_RW: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.rw.mock.signature
        run: ./scripts/build_ios_release.sh --flavor "${{ matrix.flavor }}" --skip-checks --no-codesign


  release-tooling:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [mt, rw]
    defaults:
      run:
        working-directory: dinein_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Validate release scripts syntax
        run: |
          bash -n scripts/materialize_release_env.sh
          bash -n scripts/build_web_release.sh
          bash -n scripts/build_android_release.sh
          bash -n scripts/build_ios_release.sh
          bash -n scripts/render_app_links.sh
          bash -n scripts/scan_repo_secrets.sh
          bash -n scripts/smoke_live_backend.sh
          bash -n scripts/validate_release_integrations.sh
          python3 -m py_compile scripts/stamp_pwa_bundle.py
          python3 -m py_compile scripts/serve_spa_build.py
          python3 -m py_compile scripts/assert_pwa_lighthouse.py

      - name: Validate release integrations
        env:
          PLAY_APP_SIGNING_SHA256: 11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00
          APPLE_TEAM_ID: ABCDE12345
          SUPABASE_URL_MT: https://mock-ci-mt.supabase.co
          SUPABASE_ANON_KEY_MT: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mt.mock.signature
          SUPABASE_URL_RW: https://mock-ci-rw.supabase.co
          SUPABASE_ANON_KEY_RW: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.rw.mock.signature
        run: ./scripts/validate_release_integrations.sh --flavor "${{ matrix.flavor }}"

  android-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: mt
            task: :app:lintMtRelease
          - flavor: rw
            task: :app:lintRwRelease
    defaults:
      run:
        working-directory: dinein_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Android release lint
        run: |
          cd android
          ./gradlew --no-daemon --console=plain "${{ matrix.task }}"

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dinein_app/supabase/functions
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno tests
        env:
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: mock-key
          SUPABASE_ANON_KEY: mock-anon-key
          BIOPAY_OWNER_TOKEN_SECRET: mock-biopay-secret
          BIOPAY_MANAGE_CODE_PEPPER: mock-biopay-pepper
          BIOPAY_RATE_LIMIT_SECRET: mock-rate-limit-secret
          DINEIN_ADMIN_SESSION_SECRET: mock-admin-secret
          DINEIN_VENUE_SESSION_SECRET: mock-venue-secret
        run: |
          deno test --allow-all biopay-api/index_test.ts
          deno test --allow-all dinein-api/index_test.ts
          deno test --allow-all whatsapp-otp/index_test.ts
          deno test --allow-all _shared/venue-profile-image_test.ts
          deno test --allow-all _shared/gemini-image-config_test.ts
          deno test --allow-all dinein-api/security_test.ts

  shared-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze and test packages/core
        run: |
          cd packages/core
          flutter pub get
          flutter analyze
          flutter test

      - name: Analyze packages/ui
        run: |
          cd packages/ui
          flutter pub get
          flutter analyze

  lighthouse-pwa:
    runs-on: ubuntu-latest
    needs: flutter
    defaults:
      run:
        working-directory: dinein_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build web (mt flavor)
        env:
          PLAY_APP_SIGNING_SHA256: 11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00
          APPLE_TEAM_ID: ABCDE12345
        run: |
          cat > env/release.mt.ci.json <<'JSON'
          {
            "SUPABASE_URL": "https://mock-ci.supabase.co",
            "SUPABASE_ANON_KEY": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock.signature"
          }
          JSON
          ./scripts/build_web_release.sh \
            --flavor mt \
            --env-file env/release.mt.ci.json \
            --skip-checks

      - name: Run Lighthouse route audits
        run: |
          python3 scripts/serve_spa_build.py build/web --port 4173 >/tmp/dinein-spa.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID}' EXIT

          python3 - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:4173/discover"
          for _ in range(60):
              try:
                  urllib.request.urlopen(url, timeout=2)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Timed out waiting for local SPA server.")
          PY

          mkdir -p /tmp/dinein-lh
          for route in guest:/discover venue:/venue/login admin:/admin/login; do
            name="${route%%:*}"
            path="${route#*:}"
            npx --yes lighthouse "http://127.0.0.1:4173${path}" \
              --chrome-flags="--headless=new --no-sandbox" \
              --output=json \
              --quiet \
              --output-path="/tmp/dinein-lh/${name}.json"
          done

          python3 scripts/assert_pwa_lighthouse.py \
            /tmp/dinein-lh/guest.json \
            /tmp/dinein-lh/venue.json \
            /tmp/dinein-lh/admin.json
